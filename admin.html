<style>
/* Concept: MADAR, one orbit holding specialist stores. Navy + orange, orbit-ring motif, store tiles, header cart, floating pill nav. */
:root{--bg:#F3F5F9;--surface:#FFFFFF;--fg:#0E1B2E;--muted:#5B6B82;--pri:#0F2A4A;--on-pri:#FFFFFF;--orange:#E8791A;--sky:#2F6FC0;--line:#E0E5EE;--tint:#E8EEF7;--danger:#C0392B;--ok:#1F8A5B;

*{box-sizing:border-box}

.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

 body('<div class="panel"><b>مكافآت مدار بلس</b><div class="muted" style="font-size:13px">تُصرف النقاط تلقائياً عند تحويل الطلب إلى «تم التسليم» للزبائن المسجلين، وتُسحب عند الإرجاع/الإلغاء. المكافأة قد تكون من الإدارة أو من متجر شريك (اكتب اسمه في «الجهة»).</div>'+R.map(function(w){return '<div class="panel form" style="margin-top:8px;background:var(--bg)"><label>العنوان<input data-w="'+w.id+'" data-f="title" value="'+esc(w.title)+'"></label><div class="two"><label>الجهة / المتجر الشريك<input data-w="'+w.id+'" data-f="partner" value="'+esc(w.partner||'')+'"></label><label>الكلفة (نقاط)<input type="number" data-w="'+w.id+'" data-f="cost_points" value="'+w.cost_points+'"></label></div><div class="two"><label>المخزون (فارغ = غير محدود)<input type="number" data-w="'+w.id+'" data-f="stock" value="'+(w.stock==null?'':w.stock)+'"></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-w="'+w.id+'" data-f="active" style="width:auto"'+(w.active?' checked':'')+'> فعّالة</label></div><button class="btn danger sm" data-wd="'+w.id+'">حذف المكافأة</button></div>'}).join('')+
 '<div class="panel form" style="margin-top:10px"><b>إضافة مكافأة</b><label>العنوان<input id="wt" placeholder="مثلاً: خصم 10,000 د.ع من مدار بيوتي"></label><div class="two"><label>الجهة<input id="wp" placeholder="مدار بيوتي"></label><label>الكلفة (نقاط)<input id="wc" type="number"></label></div><label>المخزون (اختياري)<input id="ws" type="number"></label><button class="btn block" id="wa">إضافة</button></div></div>'+
 '<div class="panel" style="margin-top:12px"><b>الاستبدالات</b><div class="muted" style="font-size:13px">اطلب الكود من الزبون وسلّمه المكافأة ثم علّمها مُسلَّمة.</div>'+(D.length?D.map(function(d){return '<div class="row" style="margin-top:6px"><span>'+esc(d.reward_title||'')+'<small class="muted" style="display:block">'+esc(d.partner||'')+' · '+new Date(d.created_at).toLocaleDateString('en-GB')+'</small></span><b dir="ltr">'+esc(d.code)+'</b>'+(d.status==='new'?'<button class="btn sm" data-rf="'+d.id+'">تم التسليم</button>':'<span class="muted">'+(d.status==='fulfilled'?'مُسلَّمة':'ملغاة')+'</span>')+'</div>'}).join(''):'<div class="muted" style="margin-top:6px">لا توجد استبدالات بعد</div>')+'</div>'+
 '<div class="panel form" style="margin-top:12px"><b>إضافة/خصم نقاط يدوياً</b><label>بريد الزبون<input id="pe" dir="ltr" type="email"></label><div class="two"><label>النقاط (سالب للخصم)<input id="pn" type="number"></label><label>السبب<input id="pr" placeholder="مكافأة من الإدارة"></label></div><button class="btn block" id="pa">تنفيذ</button></div>');
 $('#body').onchange=function(e){var t=e.target;if(!t.dataset.w)return;var f=t.dataset.f,v=f==='active'?t.checked:(f==='cost_points'?(+t.value||1):(f==='stock'?(t.value===''?null:+t.value):t.value));var b={};b[f]=v;api('rewards?id=eq.'+t.dataset.w,{method:'PATCH',body:b}).then(function(){toast('تم الحفظ')}).catch(function(x){toast(x.message)})};
 $('#body').onclick=function(e){var t=e.target.closest('button');if(!t)return;
  if(t.id==='wa'){var ti=$('#wt').value.trim(),c=+$('#wc').value;if(!ti||!(c>0))return toast('أدخل العنوان والكلفة');api('rewards',{method:'POST',body:{title:ti,partner:$('#wp').value.trim()||null,cost_points:c,stock:$('#ws').value===''?null:+$('#ws').value,sort:R.length+1}}).then(load).catch(function(x){toast(x.message)})}
  else if(t.dataset.wd){if(confirm('حذف هذه المكافأة؟'))api('rewards?id=eq.'+t.dataset.wd,{method:'DELETE'}).then(load).catch(function(x){toast(x.message)})}
  else if(t.dataset.rf)api('redemptions?id=eq.'+t.dataset.rf,{method:'PATCH',body:{status:'fulfilled'}}).then(load).catch(function(x){toast(x.message)});
  else if(t.id==='pa'){var em=$('#pe').value.trim(),n=parseInt($('#pn').value,10);if(!em||!n)return toast('أدخل البريد وعدد النقاط');api('rpc/plus_adjust',{method:'POST',body:{p_email:em,p_points:n,p_note:$('#pr').value.trim()}}).then(function(){toast('تم التنفيذ');$('#pe').value='';$('#pn').value=''}).catch(function(x){toast(x.message)})}}})}

function apiAll(path){var out=[],step=1000;function go(o){return api(path+(path.indexOf('?')<0?'?':'&')+'limit='+step+'&offset='+o).then(function(r){out=out.concat(r);return r.length===step?go(o+step):out})}return go(0)}
/* chat */
var chT=null,chCur=null;
function chTab(){clearInterval(chT);return api('chat_threads?select=*&order=last_at.desc&limit=200').then(function(L){
 var un=L.reduce(function(a,t){return a+(t.unread_admin>0?1:0)},0);
 body('<div class="muted" style="margin-bottom:8px">'+(un?'<b style="color:var(--orange)">'+un+' محادثة تنتظر الرد</b>':'لا توجد رسائل جديدة')+' · تتحدث الصفحة تلقائياً كل 8 ثوانٍ</div><div id="cl">'+(L.length?L.map(function(t){return '<button class="panel" data-th="'+t.id+'" style="display:block;width:100%;text-align:start;margin-bottom:8px;border:'+(t.unread_admin>0?'2px solid var(--orange)':'1px solid var(--line)')+'"><div class="row"><b>'+esc(t.name||'زائر')+'</b><span class="muted" style="font-size:12px">'+new Date(t.last_at).toLocaleString('en-GB')+'</span></div><div class="muted" style="font-size:13.5px;margin-top:3px">'+(t.last_sender==='agent'?'أنت: ':'')+esc(t.last_text||'')+'</div>'+(t.unread_admin>0?'<span class="status">'+t.unread_admin+' جديد</span>':'')+'</button>'}).join(''):'<div class="empty">لا توجد محادثات بعد</div>')+'</div><div id="cw"></div>');
 $('#body').onclick=function(e){var t=e.target.closest('[data-th]');if(t){chCur=L.filter(function(x){return x.id===t.dataset.th})[0];chOpenT()}else if(e.target.id==='cs'){var v=$('#cm').value.trim();if(!v)return;api('rpc/chat_reply',{method:'POST',body:{p_thread:chCur.id,p_body:v}}).then(function(){$('#cm').value='';chMsgs()}).catch(function(x){toast(x.message)})}else if(e.target.id==='cb'){chCur=null;load()}};
 if(chCur&&L.filter(function(x){return x.id===chCur.id}).length)chOpenT();
 chT=setInterval(function(){if(tab!=='chat'){clearInterval(chT);return}if(chCur)chMsgs();else{api('chat_threads?select=*&order=last_at.desc&limit=200').then(function(N){if(N.length&&(!L.length||N[0].last_at!==L[0].last_at||N.length!==L.length))chTab()}).catch(function(){})}},8000)})}
function chOpenT(){$('#cl').style.display='none';$('#cw').innerHTML='<div class="panel"><div class="row"><button class="btn ghost sm" id="cb">رجوع</button><b>'+esc(chCur.name||'زائر')+'</b>'+(chCur.phone?'<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+(chCur.phone.replace(/\D/g,'').replace(/^0/,'964'))+'">واتساب '+esc(chCur.phone)+'</a>':'')+'</div><div id="cmsgs" style="margin-top:10px;max-height:52vh;overflow:auto;display:grid;gap:6px"></div><div class="row" style="margin-top:10px"><input class="sm-in" id="cm" placeholder="اكتب ردك…" style="flex:1"><button class="btn" id="cs">إرسال</button></div></div>';$('#cm').onkeydown=function(e){if(e.key==='Enter')$('#cs').click()};chMsgs();api('chat_threads?id=eq.'+chCur.id,{method:'PATCH',body:{unread_admin:0}}).catch(function(){})}
function chMsgs(){if(!chCur)return;api('chat_messages?thread_id=eq.'+chCur.id+'&order=created_at').then(function(M){var b=$('#cmsgs');if(!b)return;var at=b.scrollTop+b.clientHeight>=b.scrollHeight-30;b.innerHTML=M.map(function(m){var me=m.sender==='agent';return '<div style="justify-self:'+(me?'start':'end')+';max-width:85%;padding:8px 11px;border-radius:14px;background:'+(me?'var(--pri);color:#fff':'var(--tint)')+';white-space:pre-wrap">'+esc(m.body)+'<small style="display:block;opacity:.6;font-size:10.5px">'+new Date(m.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</small></div>'}).join('');if(at||!b.dataset.s){b.scrollTop=b.scrollHeight;b.dataset.s=1}}).catch(function(){})}
/* add store */
var _cTab=cTab;cTab=function(){return _cTab().then(function(){var d=document.createElement('div');d.className='panel form';d.style.marginTop='12px';d.innerHTML='<b>إضافة متجر جديد</b><div class="muted" style="font-size:13px">عدد المتاجر والأقسام والمنتجات غير محدود. المتجر الجديد يظهر مغلقاً (قريباً) حتى تفعّله.</div><div class="two"><label>الاسم المختصر (عربي)<input id="ns_a"></label><label>الاسم الإنجليزي<input id="ns_e" dir="ltr"></label></div><button class="btn block" id="ns_b">إضافة المتجر</button>';$('#body').appendChild(d);$('#ns_b').onclick=function(){var a=$('#ns_a').value.trim(),e=$('#ns_e').value.trim();if(!a)return toast('أدخل اسم المتجر');var id='s'+Date.now().toString(36);api('stores',{method:'POST',body:{id:id,name:'مدار '+a,name_en:'Madar '+e,short:a,short_en:e,tagline:'',tagline_en:'',hue:Math.floor(Math.random()*360),icon:'spark',live:false,sort:99}}).then(function(){toast('تمت الإضافة');load()}).catch(function(x){toast(x.message)})}})}

draw();
})();
</script></body></html>
