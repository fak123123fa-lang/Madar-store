<style>

.deal{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;border-radius:16px;padding:10px 14px;background:color-mix(in srgb,var(--orange) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--orange) 40%,var(--line));font-weight:600}.deal span{display:flex;gap:6px;align-items:center}.deal b{color:var(--orange);font-size:18px;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{margin:0;padding-bottom:40px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.bar2{height:10px;background:var(--orange);border-radius:6px}.scroll{overflow:auto}.sm-in{padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.login{max-width:380px;margin:12vh auto}.ord{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--surface)}
.over{align-items:center}.sheet{border-radius:22px;max-width:620px}
.codeb{font:700 11px monospace;direction:ltr;display:inline-block;background:var(--tint,#eef1f7);color:var(--pri,#0b1e3c);border-radius:6px;padding:1px 6px;vertical-align:middle}</style></head><body><div class="wrap" id="root"></div>
<script src="config.js"></script>
<script>(function(){
var CFG=window.MADAR_CONFIG,$=function(s,r){return(r||document).querySelector(s)};
var tok=null,store=null,comm=0,cats=[],brands=[],prods=[],pq='',modal=null,SID=(new URLSearchParams(location.search).get('s')||'').replace(/[^a-z0-9_-]/gi,'');
try{tok=sessionStorage.getItem('mt_tok')}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmt(n){return Number(n||0).toLocaleString('en-US')}
function toast(m){var t=$('#toast');if(!t)return;t.innerHTML='<span>'+esc(m)+'</span>';clearTimeout(toast.t);toast.t=setTimeout(function(){t.innerHTML=''},2800)}
function api(path,o){o=o||{};var h={apikey:CFG.key,Authorization:'Bearer '+(tok||CFG.key),'Content-Type':'application/json'};if(o.prefer)h.Prefer=o.prefer;
 return fetch(CFG.url+'/rest/v1/'+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined}).then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(r.status===401){out();throw new Error('انتهت الجلسة، سجّل الدخول من جديد')}if(!r.ok)throw new Error((j&&j.message)||'خطأ');return j})})}
function out(){tok=null;try{sessionStorage.removeItem('mt_tok')}catch(e){}start()}
function auth(kind){var e=$('#em').value.trim(),p=$('#pw').value;$('#le').textContent='';if(!e||p.length<6){$('#le').textContent='اكتب البريد وكلمة مرور من 6 أحرف على الأقل';return}
 var url=CFG.url+'/auth/v1/'+(kind==='up'?'signup':'token?grant_type=password');
 fetch(url,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})}).then(function(r){return r.json()}).then(function(j){
  if(kind==='up'){if(j.access_token){tok=j.access_token;try{sessionStorage.setItem('mt_tok',tok)}catch(x){}return start()}if(j.id||j.user){$('#le').style.color='#0a7a3d';$('#le').textContent='تم إنشاء الحساب. إذا وصلك بريد تأكيد فأكّده، ثم سجّل الدخول وأرسل بريدك لإدارة مدار لربطه بمتجرك.';return}throw new Error(j.msg||j.message||j.error_description||'تعذّر إنشاء الحساب')}
  if(!j.access_token)throw new Error('بيانات الدخول غير صحيحة');tok=j.access_token;try{sessionStorage.setItem('mt_tok',tok)}catch(x){}start()}).catch(function(x){$('#le').style.color='';$('#le').textContent=x.message})}
function start(){var r=$('#root');
 if(!tok){r.innerHTML='<div class="login panel form"><h1 style="font-size:22px">مدار | بوابة التاجر</h1><div class="muted" id="sn" style="margin-bottom:6px">'+(SID?'متجر: '+esc(SID):'')+'</div><label>البريد<input id="em" type="email" autocomplete="username"></label><label>كلمة المرور<input id="pw" type="password" autocomplete="current-password"></label><div class="err" id="le"></div><button class="btn block" id="lg">دخول</button><button class="btn ghost block" id="su" style="margin-top:6px">إنشاء حساب جديد</button><div class="muted" style="font-size:12.5px;margin-top:8px">بعد إنشاء الحساب أرسل بريدك لإدارة مدار ليربطوه بمتجرك.</div></div><div id="toast" class="toast"></div>';
  $('#lg').onclick=function(){auth('in')};$('#su').onclick=function(){auth('up')};$('#pw').onkeydown=function(e){if(e.key==='Enter')auth('in')};
  if(SID)fetch(CFG.url+'/rest/v1/stores?select=name&id=eq.'+SID,{headers:{apikey:CFG.key}}).then(function(r){return r.json()}).then(function(a){if(a&&a[0]&&$('#sn'))$('#sn').textContent='متجر: '+a[0].name}).catch(function(){});return}
 r.innerHTML='<div class="muted">جاري التحميل...</div>';
 api('store_owners?select=store_id').then(function(L){
  if(!L.length){r.innerHTML='<div class="panel" style="margin:12vh auto;max-width:420px"><b>حسابك غير مرتبط بأي متجر بعد</b><p class="muted">أرسل بريدك الإلكتروني لإدارة مدار ليربطوه بمتجرك ثم أعد المحاولة.</p><button class="btn ghost" id="lo">خروج</button></div>';$('#lo').onclick=out;return}
  var ids=L.map(function(x){return x.store_id}),sid=SID&&ids.indexOf(SID)>=0?SID:null;
  if(SID&&!sid){r.innerHTML='<div class="panel" style="margin:12vh auto;max-width:420px"><b>هذا الحساب ليس مالك المتجر الذي يخصه هذا الرابط</b><p class="muted">استخدم الرابط الخاص بمتجرك.</p><button class="btn ghost" id="lo">خروج</button></div>';$('#lo').onclick=out;return}
  sid=sid||ids[0];
  return Promise.all([api('stores?select=id,name&id=eq.'+sid),api('categories?select=id,name&store_id=eq.'+sid+'&order=sort'),api('brands?select=name&order=name'),api('store_commission?select=commission_iqd&store_id=eq.'+sid),api('products?select=*&store_id=eq.'+sid+'&order=created_at.desc&limit=1000')]).then(function(x){
   store=x[0][0];cats=x[1];brands=x[2];comm=x[3][0]?x[3][0].commission_iqd:1000;prods=x[4];draw()})}).catch(function(e){r.innerHTML='<div class="err">'+esc(e.message)+'</div>'})}
function pImg(p){return p.images&&p.images[0]||''}
function draw(){var k=pq.toLowerCase(),l=prods.filter(function(p){return !k||p.name.toLowerCase().indexOf(k)>=0||(p.code||'').toLowerCase().indexOf(k)>=0}),cn=function(id){var c=cats.filter(function(x){return x.id===id})[0];return c?c.name:'بدون قسم'};
 $('#root').innerHTML='<div class="top"><h1 style="font-size:20px">'+esc(store.name)+'</h1><button class="btn ghost sm" id="lo">خروج</button></div>'+
 '<div class="panel" style="margin-block:10px;border:2px solid #E8A33D"><b>💼 عمولة مجموعة مدار: '+fmt(comm)+' د.ع</b><div class="muted" style="font-size:13px;margin-top:4px">تُحتسب على كل قطعة تُباع من متجرك. لا تظهر للزبون ولا تُضاف إلى سعر المنتج، فاحسب سعرك على هذا الأساس.</div></div>'+
 '<div class="row" style="margin-bottom:8px;gap:8px"><input class="sm-in" id="pq" placeholder="بحث بالاسم أو الكود" value="'+esc(pq)+'"><button class="btn sm" id="np">➕ منتج جديد</button></div><div class="muted" style="margin-bottom:6px">'+l.length+' منتج</div>'+
 '<div class="panel">'+(l.length?l.map(function(p){var im=pImg(p);return '<div class="arow"><div style="width:64px;height:64px;border-radius:14px;overflow:hidden;background:#EEF2F8;flex:none">'+(im?'<img src="'+esc(im)+'" alt="" style="width:100%;height:100%;object-fit:cover">':'')+'</div><div style="min-width:0"><b>'+esc(p.name)+'</b> <span class="codeb">'+esc(p.code||'')+'</span>'+(p.active?'':' <span class="status">مخفي</span>')+'<div class="muted" style="font-size:13px">'+esc(cn(p.category_id))+'</div><div class="row" style="gap:6px;margin-top:4px;justify-content:flex-start"><label class="muted" style="font-size:12px">السعر<input class="sm-in" type="number" min="0" data-qp="'+p.id+'" value="'+p.price_iqd+'" style="width:92px"></label><label class="muted" style="font-size:12px">المخزون<input class="sm-in" type="number" min="0" data-qs="'+p.id+'" value="'+p.stock+'" style="width:64px"></label></div></div><div style="display:grid;gap:4px"><button class="btn ghost sm" data-e="'+p.id+'">تعديل</button><button class="btn ghost sm" data-tg="'+p.id+'">'+(p.active?'إخفاء':'إظهار')+'</button><button class="btn danger sm" data-d="'+p.id+'">حذف</button></div></div>'}).join(''):'<div class="empty">لا توجد منتجات بعد. اضغط «منتج جديد» لإضافة أول منتج.</div>')+'</div><div id="modal"></div><div class="toast" id="toast"></div>';
 $('#lo').onclick=out;
 $('#pq').oninput=function(e){pq=e.target.value;var x=e.target.selectionStart;draw();var n=$('#pq');n.focus();n.setSelectionRange(x,x)};
 $('#np').onclick=function(){form({store_id:store.id,active:true,images:[],price_iqd:0,stock:0})};
 $('#root').onchange=function(e){var t=e.target,id=t.dataset.qp||t.dataset.qs;if(!id)return;var b={};if(t.dataset.qp)b.price_iqd=Math.max(0,+t.value||0);else b.stock=Math.max(0,+t.value||0);api('products?id=eq.'+id,{method:'PATCH',body:b}).then(function(){var p=prods.filter(function(x){return x.id===id})[0];for(var k in b)p[k]=b[k];toast('تم الحفظ')}).catch(function(x){toast(x.message)})};
 $('#root').onclick=function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.e)form(JSON.parse(JSON.stringify(prods.filter(function(p){return p.id===t.dataset.e})[0])));
  else if(t.dataset.tg){var q=prods.filter(function(p){return p.id===t.dataset.tg})[0];api('products?id=eq.'+q.id,{method:'PATCH',body:{active:!q.active}}).then(function(){q.active=!q.active;draw();toast(q.active?'تم الإظهار':'تم الإخفاء')}).catch(function(x){toast(x.message)})}
  else if(t.dataset.d){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='تأكيد الحذف';return}api('products?id=eq.'+t.dataset.d,{method:'DELETE'}).then(function(){prods=prods.filter(function(p){return p.id!==t.dataset.d});draw();toast('تم الحذف')}).catch(function(x){toast(x.message)})}}}
function upload(file){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){var name=(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()))+'.jpg';fetch(CFG.url+'/storage/v1/object/products/'+name,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+tok,'Content-Type':'image/jpeg'},body:b}).then(function(x){if(!x.ok)return x.text().then(function(t){var m='';try{m=JSON.parse(t).message||''}catch(e){}if(x.status===401||(x.status===400&&/exp|jwt|token/i.test(m))){out();throw new Error('انتهت الجلسة، سجّل الدخول من جديد ثم أعد الرفع')}throw new Error('فشل رفع الصورة'+(m?': '+m:''))});ok(CFG.url+'/storage/v1/object/public/products/'+name)}).catch(no)},'image/jpeg',.82)};im.onerror=function(){ok(null)};im.src=r.result};r.onerror=function(){ok(null)};r.readAsDataURL(file)})}
function rd(){var p=modal,g=function(i){return $('#'+i)};p.name=g('f_name').value;p.name_en=g('f_name_en').value;p.category_id=g('f_cat').value;p.brand=g('f_brand')?g('f_brand').value:'';p.size=g('f_size').value;p.price_iqd=+g('f_price').value||0;p.old_price_iqd=+g('f_old').value||0;p.stock=+g('f_stock').value||0;p.description=g('f_desc').value;p.specs=g('f_specs').value;p.warranty=g('f_warranty').value;p.usage=g('f_usage').value;p.ingredients=g('f_ing').value;p.active=g('f_active').checked}
function form(p){modal=p;function v(k){return esc(p[k]==null?'':p[k])}
 $('#modal').innerHTML='<div class="over"><div class="sheet"><div class="sbody"><h2 style="margin-bottom:8px">'+(p.id?'تعديل منتج':'منتج جديد')+(p.code?' <span class="codeb">'+esc(p.code)+'</span>':'')+'</h2>'+(pImg(p)?'<div style="display:grid;place-items:center;margin-bottom:10px"><img src="'+esc(pImg(p))+'" alt="" style="width:100%;max-width:260px;aspect-ratio:1;object-fit:contain;background:#fff;border:1px solid #E0E5EE;border-radius:18px"></div>':'')+
 '<div class="form"><label>اسم المنتج *<input id="f_name" value="'+v('name')+'"></label><label>الاسم بالإنجليزية<input id="f_name_en" dir="ltr" value="'+v('name_en')+'"></label><div class="two"><label>القسم<select id="f_cat"><option value="">بدون</option>'+cats.map(function(c){return '<option value="'+c.id+'"'+(p.category_id===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></label><label>الشركة<select id="f_brand"><option value="">بدون</option>'+brands.map(function(b){return '<option'+(p.brand===b.name?' selected':'')+'>'+esc(b.name)+'</option>'}).join('')+'</select></label></div>'+
 '<div class="two"><label>السعر (د.ع) *<input id="f_price" type="number" min="0" value="'+v('price_iqd')+'"></label><label>السعر قبل الخصم<input id="f_old" type="number" min="0" value="'+v('old_price_iqd')+'"></label></div><div class="note" id="net" style="font-weight:700"></div><div class="two"><label>المخزون<input id="f_stock" type="number" min="0" value="'+v('stock')+'"></label><label>الحجم/الموديل<input id="f_size" value="'+v('size')+'"></label></div><label>الوصف<textarea id="f_desc" rows="3">'+v('description')+'</textarea></label><label>المواصفات<textarea id="f_specs" rows="2">'+v('specs')+'</textarea></label><label>الضمان<input id="f_warranty" value="'+v('warranty')+'"></label><label>طريقة الاستخدام<textarea id="f_usage" rows="2">'+v('usage')+'</textarea></label><label>المكونات (من العبوة فقط)<textarea id="f_ing" rows="2">'+v('ingredients')+'</textarea></label><div class="thumbs">'+(p.images||[]).map(function(s,i){return '<img src="'+esc(s)+'" data-ri="'+i+'" title="اضغط للحذف" alt="">'}).join('')+'</div><label>إضافة صور (حتى 5)<input id="f_files" type="file" accept="image/*" multiple></label><label class="chk" style="display:flex;gap:8px"><input id="f_active" type="checkbox"'+(p.active?' checked':'')+' style="width:auto"> ظاهر للزبائن</label><div class="err" id="f_err"></div></div></div><div class="sfoot"><button class="btn" style="flex:1" id="f_save">حفظ</button><button class="btn ghost" id="f_x">إلغاء</button></div></div></div>';
 var net=function(){var pr=+$('#f_price').value||0;$('#net').textContent=pr>0?'صافيك بعد عمولة المجموعة ('+fmt(comm)+'): '+fmt(pr-comm)+' د.ع للقطعة'+(pr-comm<=0?' ⚠ السعر أقل من العمولة':''):''};net();$('#f_price').oninput=net;
 $('#f_x').onclick=function(){$('#modal').innerHTML=''};
 $('#modal').onclick=function(e){var i=e.target.dataset&&e.target.dataset.ri;if(i!==undefined){rd();p.images.splice(+i,1);form(p)}};
 $('#f_files').onchange=function(e){rd();var fs=[].slice.call(e.target.files).slice(0,5);toast('جاري رفع الصور...');Promise.all(fs.map(upload)).then(function(u){u.forEach(function(x){if(x)p.images.push(x)});form(p)}).catch(function(x){toast(x.message)})};
 $('#f_save').onclick=function(){rd();if(!p.name.trim())return $('#f_err').textContent='اكتب اسم المنتج';if(!(p.price_iqd>0))return $('#f_err').textContent='حدد السعر';
  var row={store_id:store.id,category_id:p.category_id||null,brand:p.brand||null,name:p.name.trim(),name_en:p.name_en||null,price_iqd:p.price_iqd,old_price_iqd:p.old_price_iqd||null,stock:p.stock,size:p.size||null,description:p.description||null,specs:p.specs||null,warranty:p.warranty||null,usage:p.usage||null,ingredients:p.ingredients||null,images:p.images||[],active:p.active};
  $('#f_save').disabled=true;api(p.id?'products?id=eq.'+p.id:'products',{method:p.id?'PATCH':'POST',body:row,prefer:'return=representation'}).then(function(r){var n=r&&r[0];if(n){var i=prods.findIndex(function(x){return x.id===n.id});if(i>=0)prods[i]=n;else prods.unshift(n)}$('#modal').innerHTML='';draw();toast('تم الحفظ')}).catch(function(x){$('#f_save').disabled=false;$('#f_err').textContent=x.message})}}
start();
})();
</script></body></html>
