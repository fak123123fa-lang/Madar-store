<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B1E3C"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>body{margin:0}</style>
<title>مدار</title>

<style id="css">
/* Concept: MADAR, one orbit holding specialist stores. Navy + orange, orbit-ring motif, store tiles, header cart, floating pill nav. */
:root{--bg:#F3F5F9;--surface:#FFFFFF;--fg:#0E1B2E;--muted:#5B6B82;--pri:#0B1E3C;--on-pri:#FFFFFF;--orange:#FF7A00;--sky:#0095C8;--line:#E0E5EE;--tint:#E8EEF7;--danger:#C0392B;--ok:#1F8A5B;

:root[data-theme="dark"]{--bg:#09111F;--surface:#101C30;--fg:#E8EEF7;--muted:#97A6BC;--pri:#8CB9F2;--on-pri:#08121F;--orange:#FFA24D;--sky:#7FB2F0;--line:#22324A;--tint:#16253D;--danger:#E8806F;--ok:#5FCB9A;--hero-a:#0A1A33;--hero-b:#163F73;--shadow:0 12px 30px -14px rgba(0,0,0,.8);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}

:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;min-width:0}

.pic img.photo{inset:0;width:100%;height:100%;object-fit:cover}

.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

function chSend(){var i=$('#chq'),txt=(i&&i.value||'').trim();if(!txt||CH.busy)return;var n=$('#chn'),p=$('#chp');if(n){CH.info.name=n.value.trim();CH.info.phone=p?p.value.trim():CH.info.phone;if(!CH.info.name&&!(AU&&AU.name)){toast('اكتب اسمك أولاً');return}LS.set('chinfo',CH.info)}
 var nm=CH.info.name||(AU&&AU.name)||'';i.value='';CH.msgs.push({s:'customer',b:txt,t:new Date().toISOString()});chPaint();

function aiImgFile(file){if(!file||AI.typing)return;var u=URL.createObjectURL(file),im=new Image();AI.typing=true;
 im.onload=function(){var s=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(8,Math.round(im.width*s));c.height=Math.max(8,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);var du=c.toDataURL('image/jpeg',.7),t=document.createElement('canvas');t.width=t.height=48;t.getContext('2d').drawImage(im,0,0,48,48);URL.revokeObjectURL(u);AI.feat=feat(t);AI.canvas=c;AI.labels=undefined;AI.msgs.push({r:'u',img:du});keep();aiScroll();aiImgRun('')};
 im.onerror=function(){AI.typing=false;toast('تعذر قراءة الصورة')};im.src=u}
function aiImgRun(txt){var words=nrm(txt+' '+labelWords(AI.labels||[])).split(/\s+/).filter(function(t){return t&&STOP.indexOf(t)<0}).map(stem).filter(function(t){return t.length>=2}),groups=words.length?expand(words):[],pool=live().filter(function(p){return p.stock>0}).slice(0,200);
 Promise.all(pool.map(loadPF)).then(function(fs){var out=pool.map(function(p,i){var sc=groups.length?scoreP(p,groups,[]):{hit:0,core:0},cs=AI.feat?simF(AI.feat,fs[i]):0;return{p:p,txt:sc.hit>0,v:(groups.length?Math.min(sc.core,9)/9*.65:0)+cs*(groups.length?.35:1),c:cs}});
  var hasT=out.some(function(x){return x.txt});out=groups.length&&hasT?out.filter(function(x){return x.txt}):out.filter(function(x){return x.c>.62});out.sort(function(a,b){return b.v-a.v});var L=out.slice(0,3).map(function(x){return x.p}),h;
  if(L.length){var tg=tagFor(L);h='لقيت لك هاي الأقرب لصورتك'+(groups.length?' ووصفك':' (بالألوان والشكل العام)')+':'+L.map(function(p){return aiPick(p,tg[p.id],L)}).join('')+'<div class="aihint">للدقة أكثر اكتب لي شنو هذا المنتج (مثلاً: شنطة يد سودة) وأعيد البحث.</div>';AI.imgWait=!groups.length}
  else{h='ما لگيت شي يشبه الصورة بالمتوفر حالياً 😔 اكتب لي وصفها بكلمات وأدور لك، أو اسأل المتجر مباشرة.<a class="btn ghost sm" target="_blank" rel="noopener" href="https://wa.me/'+waNum()+'?text='+encodeURIComponent('هلا، أبحث عن منتج مشابه لصورة سأرسلها لكم. هل يتوفر؟')+'">اسأل على واتساب</a>';AI.imgWait=true}
  AI.msgs.push({r:'b',h:h});AI.typing=false;keep();aiScroll()})}
var _aiSend=aiSend;aiSend=function(text){text=(text||'').trim();if(AI.imgWait&&AI.feat&&text&&!AI.typing){AI.imgWait=false;AI.draft='';AI.msgs.push({r:'u',t:text});AI.typing=true;keep();aiScroll();aiImgRun(text);return}_aiSend(text)};

POL.privacy={ar:['سياسة الخصوصية',['آخر تحديث: نوفمبر 2026. توضح هذه السياسة كيف تجمع «مدار – مجموعة مدار التجارية» بياناتك وتستخدمها وتحميها عند استخدامك للمتجر وتطبيقه، وهي تعمل في جمهورية العراق وفق القوانين النافذة فيها.',
 '## البيانات التي نجمعها',
 '• بيانات الطلب: الاسم الكامل، رقم الهاتف، المحافظة والمنطقة والعنوان وأقرب نقطة دالة، وأي ملاحظة تكتبها.',
 '• بيانات الحساب (اختيارية): البريد الإلكتروني والاسم، أو بيانات تعريف حساب Google عند الدخول به. لا نحتفظ بكلمة مرورك، فهي تُدار مشفّرة لدى مزوّد المصادقة.',
 '• المحادثة مع مدير المبيعات: الاسم، ورقم الهاتف إن أدخلته، ونص الرسائل.',
 '• التقييمات: الاسم والتعليق ودرجة التقييم التي تكتبها.',
 '• الصور في «البحث بالصورة» تُحلَّل على جهازك لحظياً، ولا تُرفع إلى خوادمنا ولا تُخزَّن.',
 '• تخزين محلي على جهازك: السلة والمفضلة واللغة والعملة والمدينة وآخر ما تصفحته، لتسهيل استخدامك.',
 '• لا نجمع ولا نخزّن بيانات بطاقات مصرفية؛ الدفع عند الاستلام.',
 '## كيف نستخدم بياناتك',
 '• تنفيذ طلبك وتوصيله والتواصل معك بشأنه وإصدار الفاتورة.',
 '• الرد على استفساراتك عبر المحادثة وواتساب وخدمة العملاء.',
 '• احتساب نقاط «مدار بلس» واستبدال المكافآت.',
 '• منع الاحتيال والطلبات الوهمية وحماية المتجر والزبائن.',
 '• تحسين المنتجات والخدمات. لا نرسل لك رسائل ترويجية إلا بموافقتك.',
 '## مشاركة البيانات',
 'لا نبيع بياناتك ولا نؤجرها. نشاركها فقط بالقدر اللازم مع: شركة أو مندوب التوصيل (الاسم والهاتف والعنوان)، والمتاجر الشريكة عند استبدالك مكافأة منها، ومزوّدي الخدمات التقنية الذين يستضيفون المتجر وقاعدة بياناته، والجهات الرسمية إذا طُلب منا ذلك قانونياً.',
 '## واتساب',
 'عند اختيارك إرسال الفاتورة أو التواصل عبر واتساب تنتقل المحادثة إلى تطبيق واتساب وتخضع لسياسة خصوصيته. أنت من يقرر إرسال الرسالة.',
 '## مدار بلس',
 'تُسجَّل نقاطك وعمليات استبدالها في حسابك وحده، ولا تُعرض لزبائن آخرين. قد نشارك اسم المكافأة ورمز الاستبدال مع المتجر الشريك المعني لتسليمها لك.',
 '## الأمان',
 'نستخدم اتصالاً مشفّراً (HTTPS)، وصلاحيات وصول مفصولة على قاعدة البيانات بحيث لا يرى الزبون إلا بياناته، وحسابات إدارة محمية بتسجيل دخول. ومع ذلك لا توجد وسيلة حماية مطلقة، فاحرص على سرية بيانات دخولك.',
 '## مدة الاحتفاظ',
 'نحتفظ ببيانات الطلبات للمدة اللازمة للمحاسبة والضمان والإرجاع وحل النزاعات، وبالمحادثات والحسابات ما دام حسابك قائماً أو حتى تطلب حذفها، ثم نحذفها أو نجعلها مجهولة الهوية.',
 '## حقوقك',
 'يحق لك طلب الاطلاع على بياناتك أو تصحيحها أو حذفها (بما فيها المحادثات والحساب)، وسحب موافقتك على الرسائل الترويجية، والاعتراض على معالجة بياناتك. أرسل طلبك عبر المحادثة أو واتساب وننفذه خلال مدة معقولة.',
 '## حذف حسابك',
 'يمكنك حذف حسابك نهائياً في أي وقت من «حسابي ← حذف حسابي» داخل التطبيق، أو عبر صفحة طلب الحذف على موقعنا (delete-account.html) إن لم تستطع الدخول. عند الحذف نزيل فوراً: الحساب، نقاط مدار بلس وجوائز العجلة وسلسلة الحضور، والإحالات، ومحادثاتك مع المبيعات. تبقى سجلات الطلبات المنفّذة (الاسم والهاتف وعنوان التسليم) للمدة اللازمة للمحاسبة والضمان وحل النزاعات ثم تُحذف أو تُجعل مجهولة.',
 '## الأطفال',
 'المتجر غير موجّه لمن هم دون 18 عاماً، ونرجو أن يتم الطلب بإشراف ولي الأمر.',
 '## روابط وخدمات خارجية',
 'قد تحتوي صفحاتنا على روابط لمنصات خارجية (واتساب، وسائل التواصل، Google). لسنا مسؤولين عن سياسات خصوصيتها.',
 '## تعديل السياسة',
 'قد نحدّث هذه السياسة من وقت لآخر، ويظهر تاريخ آخر تحديث أعلاها. استمرارك في استخدام المتجر بعد التحديث يعني موافقتك عليه.',
 '## التواصل معنا',
 'لأي سؤال أو طلب بخصوص خصوصيتك: تحدّث مع مدير المبيعات من زر المحادثة، أو عبر واتساب على الرقم {{wa}}.']],
 en:['Privacy Policy',['Last updated: November 2026. This policy explains how MADAR (Madar Trading Group), operating in the Republic of Iraq, collects, uses and protects your data.',
 '## What we collect',
 '• Order details: name, phone, governorate, area, address, landmark and notes.',
 '• Account details (optional): email and name, or Google profile identifiers if you sign in with Google. We do not keep your password.',
 '• Sales chat: name, optional phone and message text. Reviews: name, rating and comment.',
 '• Photos used in image search are analysed on your device and are never uploaded or stored.',
 '• Local storage on your device: cart, favourites, language, currency, city and recent views.',
 '• We do not collect card data; payment is cash on delivery.',
 '## How we use it',
 'To fulfil and deliver orders, issue invoices, answer your questions, calculate Madar Plus points, prevent fraud, and improve the store. We send promotions only with your consent.',
 '## Sharing',
 'We never sell your data. We share only what is needed with delivery companies, partner stores (for reward redemptions), technical service providers that host the store, and authorities when legally required.',
 '## WhatsApp',
 'When you send an invoice or contact us through WhatsApp, the conversation moves to WhatsApp and is governed by its policy.',
 '## Security and retention',
 'Encrypted connections, per-user database access rules and protected admin accounts. We keep order data as long as needed for accounting, warranty and returns, and chats and accounts until you ask us to delete them.',
 '## Your rights',
 'You may request access, correction or deletion of your data, withdraw marketing consent, and object to processing, via the sales chat or WhatsApp.',
 '## Deleting your account',
 'You can permanently delete your account any time from Account → Delete my account inside the app, or via the account deletion page on our website (delete-account.html) if you cannot sign in. We immediately remove your account, Madar Plus points, wheel prizes, streak, referrals and sales chats. Records of completed orders (name, phone, delivery address) are kept only as long as needed for accounting, warranty and disputes, then deleted or anonymised.',
 '## Children and changes',
 'The store is not directed to people under 18. We may update this policy; the date above shows the latest version.',
 '## Contact',
 'Use the sales chat button or WhatsApp at {{wa}}.']]};
POL.terms={ar:['شروط الاستخدام',['باستخدامك متجر «مدار» أو إتمامك طلباً فيه فإنك توافق على الشروط التالية.',
 '## الطلبات والتأكيد',
 '• كل طلب يخضع للتأكيد من فريق المبيعات هاتفياً أو عبر واتساب قبل التجهيز، ويحق لنا رفض أو إلغاء أي طلب غير مكتمل البيانات أو غير موثوق.',
 '• أنت مسؤول عن صحة الاسم والهاتف والعنوان المدخلة.',
 '## الأسعار والتوفر',
 '• الأسعار بالدينار العراقي، ويُعرض الدولار للمعلومة فقط حسب سعر الصرف المعتمد في المتجر.',
 '• قد تتغير الأسعار والعروض والكميات دون إشعار مسبق، والسعر المعتمد هو المعروض وقت تأكيد الطلب. العروض محددة بوقتها أو بنفاد الكمية.',

 '• الدفع نقداً عند الاستلام. يرجى فحص المنتج بحضور المندوب.',
 '## الإلغاء والإرجاع والاستبدال',
 'تُطبَّق «سياسة الاستبدال والإرجاع» المنشورة في المتجر، وهي جزء من هذه الشروط.',
 '## الحسابات ومدار بلس',
 '• يمكنك الطلب كضيف أو بحساب. أنت مسؤول عن سرية بيانات دخولك.',
 '• نقاط «مدار بلس» ليس لها قيمة نقدية، غير قابلة للتحويل أو البيع، وتُضاف عند تسليم الطلب وتُسحب عند الإرجاع أو الإلغاء، ويحق لنا إيقافها أو تعديل المكافآت عند إساءة الاستخدام أو التحايل.',

 'الشعار والتصاميم ونصوص المتجر ملك لمجموعة مدار، ولا يجوز نسخها دون إذن. أسماء الماركات المعروضة ملك لأصحابها.',
 '## حدود المسؤولية',
 'نبذل جهدنا لدقة المعلومات والصور، وقد تختلف الألوان والتغليف قليلاً عن الواقع. لا نتحمل أضراراً غير مباشرة ناتجة عن استخدام الموقع، ولا يمس ذلك حقوقك القانونية.',

 'تخضع هذه الشروط لقوانين جمهورية العراق، وتختص محاكمها بالنظر في أي نزاع بعد محاولة الحل الودي.',
 '## التعديل والتواصل',

 en:['Terms of Use',['By using MADAR or placing an order you agree to these terms.',
